name: Build Signed AAB & APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html privacy.html www/
          cp -r css js www/

      - name: Initialize Capacitor & Android
        run: |
          npm install
          npx cap init "HONOR Snake" "com.honor.snakeescape" --web-dir="www"
          npx cap add android
          npx cap sync

      - name: Generate Keystore & Configure Signing
        run: |
          keytool -genkey -v -keystore android/app/honor-release.keystore -alias honor_key -keyalg RSA -keysize 2048 -validity 10000 -storepass Honor2026Pass -keypass Honor2026Pass -dname "CN=HONOR Games, OU=Dev, O=HONOR, L=Cairo, S=Cairo, C=EG"
          cat << 'EOF' >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('honor-release.keystore')
                      storePassword 'Honor2026Pass'
                      keyAlias 'honor_key'
                      keyPassword 'Honor2026Pass'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Signed AAB & APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: Upload Release Files
        uses: actions/upload-artifact@v4
        with:
          name: HONOR-Snake-GooglePlay-Release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/honor-release.keystore
